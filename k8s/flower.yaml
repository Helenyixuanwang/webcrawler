
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      containers:
        - name: flower
          image: webcrawler-api:latest
          imagePullPolicy: Never
          command: ["celery", "-A", "app.core.celery_app", "flower", "--port=5555", "--address=0.0.0.0"]
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
            - name: FLOWER_PORT
              value: "5555"
          ports:
            - containerPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: flower
spec:
  selector:
    app: flower
  type: NodePort
  ports:
    - port: 5555
      targetPort: 5555
      nodePort: 30555
